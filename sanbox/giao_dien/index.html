<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sandbox Rồng Thần 🐉</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ============================================================ -->
<!-- HEADER SANDBOX                                               -->
<!-- ============================================================ -->
<header id="header-sandbox" class="header-sandbox">
    <div class="sandbox-tieude">
        <span class="sandbox-icon">🧪</span>
        <span class="sandbox-chu">Sandbox Rồng Thần</span>
    </div>
    <div class="sandbox-header-nut">
        <button id="nut-chay" class="nut-nho" title="Chạy code">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
                <polygon points="5,3 19,12 5,21"/>
            </svg>
            <span>Chạy</span>
        </button>
        <button id="nut-dung" class="nut-nho" title="Dừng">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
                <rect x="6" y="6" width="12" height="12"/>
            </svg>
            <span>Dừng</span>
        </button>
        <button id="nut-copy" class="nut-nho" title="Copy code">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
            </svg>
            <span>Copy</span>
        </button>
        <button id="nut-xoa" class="nut-nho" title="Xóa output">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="3,6 5,6 21,6"/>
                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
            </svg>
            <span>Xóa</span>
        </button>
    </div>
</header>

<!-- ============================================================ -->
<!-- CHỌN NGÔN NGỮ                                                -->
<!-- ============================================================ -->
<div id="chon-ngon-ngu" class="chon-ngon-ngu">
    <button class="nut-ngon-ngu dang-chon" data-ngon-ngu="html">HTML</button>
    <button class="nut-ngon-ngu" data-ngon-ngu="python">Python</button>
    <button class="nut-ngon-ngu" data-ngon-ngu="javascript">JavaScript</button>
    <button class="nut-ngon-ngu" data-ngon-ngu="typescript">TypeScript</button>
    <button class="nut-ngon-ngu" data-ngon-ngu="css">CSS</button>
    <button class="nut-ngon-ngu" data-ngon-ngu="markdown">Markdown</button>
</div>

<!-- ============================================================ -->
<!-- KHU VỰC SANDBOX                                              -->
<!-- ============================================================ -->
<main id="khung-sandbox" class="khung-sandbox">

    <!-- CHỌN CHẾ ĐỘ XEM -->
    <div id="chon-che-do" class="chon-che-do">
        <button class="nut-che-do dang-chon" data-che-do="result">Kết quả</button>
        <button class="nut-che-do" data-che-do="editor">Code</button>
        <button class="nut-che-do" data-che-do="console">Console</button>
        <button class="nut-che-do" data-che-do="tests">Tests</button>
    </div>

    <!-- CONTAINER LIVECODES -->
    <div id="livecodes-container" class="livecodes-container"></div>

    <!-- TRẠNG THÁI -->
    <div id="trang-thai-sandbox" class="trang-thai-sandbox">
        Sẵn sàng chạy code.
    </div>

</main>

<!-- ============================================================ -->
<!-- OUTPUT BỔ SUNG (khi không dùng iframe)                       -->
<!-- ============================================================ -->
<section id="output-bo-sung" class="output-bo-sung">
    <div class="output-header">
        <span>📤 Output</span>
        <span id="thoi-gian-chay" class="thoi-gian-chay"></span>
    </div>
    <pre id="sandbox-stdout" class="sandbox-stdout"></pre>
    <pre id="sandbox-stderr" class="sandbox-stderr"></pre>
    <pre id="sandbox-tests" class="sandbox-tests"></pre>
</section>

<!-- ============================================================ -->
<!-- FOOTER SANDBOX                                               -->
<!-- ============================================================ -->
<footer id="footer-sandbox" class="footer-sandbox">
    <div class="footer-info">
        <span id="info-ngon-ngu">HTML</span>
        <span class="phan-cach">•</span>
        <span id="info-dong">0 dòng</span>
        <span class="phan-cach">•</span>
        <span id="info-ky-tu">0 ký tự</span>
    </div>
    <div class="footer-trang-thai">
        <span id="trang-thai-ngan" class="trang-thai-ngan">●</span>
        <span id="trang-thai-chu">Chưa chạy</span>
    </div>
</footer>

<!-- ============================================================ -->
<!-- SCRIPT                                                       -->
<!-- ============================================================ -->
<script src="nhung_livecodes.js"></script>

</body>
</html>
